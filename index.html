<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ahmad's Portfolio</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2250%22 fill=%22%23Facc15%22/></svg>">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "react/jsx-runtime": "https://esm.sh/react@18.2.0/jsx-runtime",
        "three": "https://esm.sh/three@0.160.0",
        "@react-three/fiber": "https://esm.sh/@react-three/fiber@8.15.12?external=react,react-dom,three",
        "@studio-freight/lenis": "https://esm.sh/@studio-freight/lenis@1.0.39"
      }
    }
  </script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <style>
    :root {
      --brand-yellow: #FFC700;
      --bg-color: #000000;
      --text-main: var(--brand-yellow);
      --text-secondary: var(--brand-yellow);
      --nav-bg: rgba(255, 255, 255, 0.1);
      --nav-border: rgba(255, 255, 255, 0.2);
    }

    [data-theme="light"] {
      --bg-color: var(--brand-yellow);
      --text-main: #000000;
      --text-secondary: #000000;
      --nav-bg: rgba(0, 0, 0, 0.1);
      --nav-border: rgba(0, 0, 0, 0.3);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      margin: 0;
      padding: 0;
      background-color: #050505;
      color: white;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      cursor: default; 
      user-select: none;
    }

    .r3f-container {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
    }

    .layout-wrapper {
      position: relative; z-index: 10;
      width: 100vw; height: 100vh;
      background-color: var(--bg-color);
      transition: background-color 0.4s ease;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      overflow: hidden;
    }

    header {
      position: fixed; /* Changed from absolute to fixed */
      top: 30px; left: 0; width: 100%;
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 40px; z-index: 100;
    }

    .site-logo {
      width: 50px; height: 50px; border-radius: 50%;
      background: var(--brand-yellow);
      display: flex; align-items: center; justify-content: center;
      transition: 0.4s;
    }
    .github-logo svg { width: 30px; height: 30px; fill: var(--bg-color); transition: 0.4s; }
    [data-theme="light"] .github-logo svg { fill: var(--brand-yellow); }

    nav {
      background: var(--nav-bg); border: 1px solid var(--nav-border);
      padding: 12px 35px; border-radius: 50px;
      backdrop-filter: blur(8px); display: flex; gap: 30px;
    }
    nav a {
      color: var(--text-secondary); text-decoration: none; font-size: 13px;
      letter-spacing: 1.5px; font-weight: 600; transition: color 0.4s; cursor: pointer;
    }

    .theme-switch {
      background: var(--nav-bg); border: 1px solid var(--nav-border);
      padding: 8px 12px; border-radius: 30px;
      display: flex; align-items: center; gap: 15px; cursor: pointer;
      backdrop-filter: blur(8px); transition: 0.4s;
    }
    .theme-switch svg { width: 18px; height: 18px; fill: var(--text-secondary); opacity: 0.5; transition: 0.3s; }
    .theme-switch .active svg { opacity: 1; fill: var(--brand-yellow); }
    [data-theme="light"] .theme-switch .active svg { fill: #000; }

    .hero-text {
      font-family: 'Anton', sans-serif;
      font-size: 13vw;
      color: var(--text-main);
      text-transform: uppercase;
      line-height: 0.8;
      text-align: center;
      position: absolute; top: 45%; left: 50%;
      transform: translate(-50%, -50%);
      white-space: nowrap;
      z-index: 15; 
      transition: color 0.4s ease;
    }

    .person-img {
      position: absolute; bottom: 0; left: 50%;
      transform: translateX(-50%);
      height: 75vh;
      object-fit: contain;
      z-index: 10000; 
      pointer-events: none;
    }

    .socials {
      position: absolute; left: 40px; bottom: 40px;
      display: flex; flex-direction: column; gap: 22px; z-index: 100;
    }
    .socials svg { width: 22px; height: 22px; fill: var(--text-secondary); transition: 0.4s; cursor: pointer;}

    .glitch-wrapper {
      position: absolute; right: 40px; bottom: 40px;
      font-family: 'Inter', sans-serif; font-weight: 600;
      font-size: 18px; letter-spacing: 2px;
      color: var(--text-secondary); z-index: 100;
      transition: color 0.4s; text-transform: uppercase;
    }
    .glitch { position: relative; display: inline-block; }
    .glitch::before, .glitch::after {
      content: attr(data-text); position: absolute; top: 0; left: 0;
      width: 100%; height: 100%; background: transparent; color: var(--text-secondary);
      opacity: 0;
    }
    .glitch.active::before {
      left: 3px; text-shadow: -2px 0 red; opacity: 1;
      animation: glitch-anim 0.2s infinite linear alternate-reverse;
    }
    .glitch.active::after {
      left: -3px; text-shadow: -2px 0 blue; opacity: 1;
      animation: glitch-anim-2 0.3s infinite linear alternate-reverse;
    }

    @keyframes glitch-anim {
      0% { clip-path: inset(20% 0 80% 0); }
      50% { clip-path: inset(60% 0 10% 0); }
      100% { clip-path: inset(40% 0 40% 0); }
    }
    @keyframes glitch-anim-2 {
      0% { clip-path: inset(10% 0 60% 0); }
      50% { clip-path: inset(80% 0 5% 0); }
      100% { clip-path: inset(30% 0 20% 0); }
    }

    .venom-wrapper {
      position: fixed; inset: 0; z-index: 9999; pointer-events: none;
      mix-blend-mode: difference; 
    }
    .venom-goo-container {
      width: 100%; height: 100%;
      filter: url('#venom-goo');
    }
    canvas { width: 100vw; height: 100vh; display: block; }

    .shutter-container {
      position: fixed;
      inset: 0;
      z-index: 15000;
      pointer-events: none;
      display: flex;
      align-items: flex-end;
    }

    .shutter-panel {
      width: 100vw;
      height: 100vh;
      background: rgba(255, 204, 0, 0.985); 
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      transform: translateY(100%);
      transition: transform 0.5s ease;
      position: relative;
      pointer-events: auto;
    }

    [data-theme="light"] .shutter-panel {
      background: rgba(0, 0, 0, 0.95);
    }

    .work-btn {
      position: absolute;
      top: -100px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(40px) saturate(200%);
      -webkit-backdrop-filter: blur(40px) saturate(200%);
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 0 20px rgba(255, 255, 255, 0.25);
      color: var(--text-secondary);
      padding: 12px 30px;
      border-radius: 40px; 
      font-weight: 600;
      letter-spacing: 2px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      opacity: 0;
      transition: all 0.3s ease;
      pointer-events: auto; 
    }

    .work-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateX(-50%) scale(1.05);
    }

    [data-theme="light"] .work-btn {
      background: rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(0, 0, 0, 0.3);
      color: #000;
    }

    .shutter-container.phase-1 .shutter-panel {
      transform: translateY(82%);
    }
    .shutter-container.phase-1 .work-btn { opacity: 1; }
    
    .shutter-container.phase-2 .shutter-panel,
    .shutter-container.phase-4 .shutter-panel {
      transform: translateY(0%);
      transition: transform 1.8s cubic-bezier(0.1, 0.95, 0.2, 1);
    }
    .shutter-container.phase-2 .work-btn,
    .shutter-container.phase-4 .work-btn { 
      opacity: 0; 
      pointer-events: none; 
    }
    
    .shutter-container.phase-3 .shutter-panel {
      transform: translateY(-100%);
      transition: transform 1.8s cubic-bezier(0.8, 0, 0.9, 0.1);
    }

    .work-page {
      position: absolute;
      inset: 0;
      z-index: 14000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg-color);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0s;
    }
    
    .work-page.active { opacity: 1; pointer-events: auto; }

    /* --- NEW WORK PAGE CENTER CONTENT --- */
    .work-center-content {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 15;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
      pointer-events: none; /* Allows hovering videos, but button re-enables it */
    }

    .welcome-text {
      font-family: 'Inter', sans-serif;
      font-weight: 800;
      font-size: 8vw;
      color: var(--brand-yellow);
      margin: 0;
      letter-spacing: 6px;
      line-height: 1;
      text-transform: uppercase;
      text-shadow: 0 10px 40px rgba(0,0,0,0.8);
    }

    .glass-magnify-btn {
      pointer-events: auto;
      width: 260px;
      height: 75px;
      border-radius: 40px; 
      background: rgba(255, 255, 255, 0.05);
      border: 1.5px solid rgba(255, 255, 255, 0.4);
      box-shadow: 
        0 8px 32px rgba(0, 0, 0, 0.5), 
        inset 0 0 20px rgba(255, 255, 255, 0.2);
      /* Backdrop filter sets the base for the glass look */
      backdrop-filter: blur(4px) brightness(1.2) contrast(1.1); 
      -webkit-backdrop-filter: blur(4px) brightness(1.2) contrast(1.1);
      color: #ffffff;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      letter-spacing: 3px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .glass-magnify-btn:hover {
      transform: scale(1.05);
      background: rgba(255, 255, 255, 0.15);
      box-shadow: 
        0 12px 40px rgba(0, 0, 0, 0.6), 
        inset 0 0 30px rgba(255, 255, 255, 0.4);
    }
    /* ----------------------------------- */

    .media-grid-wrapper {
      position: absolute;
      inset: -5%; 
      width: 110%;
      height: 110%;
      z-index: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050505; 
      overflow: hidden;
    }

    .media-grid-wrapper::after {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 5;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.98) 0%,
        rgba(0,0,0,0.7) 15%,
        rgba(0,0,0,0) 50%,
        rgba(0,0,0,0.7) 85%,
        rgba(0,0,0,0.98) 100%
      );
    }

    .media-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 12px; 
      width: 100vw;
      height: auto;
      padding: 0 2vw;
      align-content: center;
      justify-content: center;
      transform: scale(1.05);
    }

    .grid-item {
      height: 23vh; 
      border-radius: 12px;
      overflow: hidden;
      background: #1a1a1a;
      flex-grow: 1; 
      box-shadow: inset 0 0 10px rgba(0,0,0,0.8), 0 8px 15px rgba(0,0,0,0.9);
    }

    .grid-item:nth-child(7n + 1) { width: 22%; }
    .grid-item:nth-child(7n + 2) { width: 35%; }
    .grid-item:nth-child(7n + 3) { width: 12%; }
    .grid-item:nth-child(7n + 4) { width: 22%; }
    .grid-item:nth-child(7n + 5) { width: 35%; }
    .grid-item:nth-child(7n + 6) { width: 12%; }
    .grid-item:nth-child(7n + 7) { width: 28%; }

    .grid-item video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: blur(1.5px) brightness(0.65); 
      transform: scale(1.05); 
    }

    .work-header { 
      position: absolute; 
      top: 30px; 
      left: 0; 
      width: 100%; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      padding: 0 40px; 
      z-index: 15000; 
    }
    .work-header nav a { color: #fff !important; text-shadow: none !important; }
    .work-header .site-logo { background: rgba(255,255,255,0.1) !important; color: #fff !important; border: 1px solid rgba(255,255,255,0.2); box-shadow: none !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }
    .work-header .site-logo svg { fill: #fff !important; filter: none !important; }
    .work-header nav, .work-header .theme-switch { background: rgba(255,255,255,0.05) !important; border: 1px solid rgba(255,255,255,0.2) !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; box-shadow: none !important; }
    .work-header .theme-switch svg { fill: #fff !important; opacity: 0.6; filter: none !important; }
    .work-header .theme-switch .active svg { fill: #fff !important; opacity: 1; filter: none !important; }
    /* --- ZOOM OUT CAROUSEL STYLES --- */
    .work-zoom-ui {
      position: absolute;
      inset: 0;
      z-index: 16000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
      background: transparent;
      overflow: hidden;
    }
    
    .grid-welcome-content {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease, transform 0.6s ease;
      transform: translateY(20px);
    }

    .grid-welcome-content.active {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .welcome-grid-title {
      font-family: 'Anton', sans-serif;
      font-size: 8vw;
      color: var(--brand-yellow);
      letter-spacing: 2px;
      text-align: center;
      text-transform: uppercase;
      text-shadow: 2px 2px 0px #000, -2px -2px 0px #000, 4px 4px 15px rgba(0,0,0,0.8);
      margin: 0;
      line-height: 1.1;
    }
    
    .work-zoom-ui.active {
      opacity: 1;
      pointer-events: none; /* Allows clicks to pass through to the header */
    }

    .work-content-scaler {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      transform-origin: center;
      transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), border-radius 0.8s ease, box-shadow 0.8s ease;
      overflow: hidden;
      background: var(--bg-color);
    }

    /* --- ENHANCED GLASS PANE OVERLAY --- */
    .work-content-scaler::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.8s ease;
      z-index: 100;
      /* CHANGED TO BLACK: Inner rim and shadows are now dark to create depth */
      box-shadow: inset 0 0 0 2px rgba(0, 0, 0, 0.7), 
                  inset 0 0 50px rgba(0, 0, 0, 0.6),
                  inset 20px 20px 80px rgba(0, 0, 0, 0.4);
      /* Softened the diagonal light reflection so the black shadow stands out more */
      background: linear-gradient(
        135deg, 
        rgba(255, 255, 255, 0.1) 0%, 
        rgba(255, 255, 255, 0.02) 20%, 
        rgba(255, 255, 255, 0) 50%, 
        rgba(255, 255, 255, 0.01) 80%,
        rgba(255, 255, 255, 0.08) 100%
      );
    }
    
    .work-content-scaler.zoomed-out {
      transform: scale(0.55);
      border-radius: 30px; 
      
      /* SOFTER, LESS INTENSE WHITE SHADOW: Tighter blur and lower opacity */
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.05), 
                  0 15px 35px rgba(255, 255, 255, 0.08), 
                  0 0 0 1px rgba(255, 255, 255, 0.15);
      pointer-events: none; 
    }

    .work-content-scaler.zoomed-out::after {
      opacity: 1;
    }

    .carousel-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 50px;
      height: 50px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 13600;
      transition: 0.3s;
      pointer-events: auto; /* Re-enables clicks specifically for the arrows */
    }
    .carousel-arrow svg { fill: #fff; width: 24px; height: 24px; }
    .carousel-arrow:hover { background: rgba(255, 255, 255, 0.2); transform: translateY(-50%) scale(1.1); }
    .carousel-arrow.left { left: 4%; }
    .carousel-arrow.right { right: 4%; }

    .ticker-container {
      position: absolute;
      bottom: 8%;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      align-items: center;
      height: 40px;
      z-index: 13600;
    }
    .ticker-bar {
      width: 3px;
      background: rgba(255, 255, 255, 1);
      border-radius: 2px;
      transition: all 0.2s ease;
    }
    .ticker-bar.active { background: #fff; box-shadow: 0 0 10px rgba(255,255,255,0.8); }

    .project-frame {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #050505;
      overflow: hidden;
      pointer-events: auto;
    }
    
    .project-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: all 0.4s ease;
    }
    
    .project-frame:hover .project-img {
      filter: blur(8px) brightness(0.3);
      transform: scale(1.05);
    }
    
    .view-details-btn {
      position: absolute;
      opacity: 0;
      pointer-events: none;
      width: 220px;
      height: 60px;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.05);
      border: 1.5px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(8px) brightness(1.2);
      -webkit-backdrop-filter: blur(8px) brightness(1.2);
      color: #ffffff;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.4s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }
    
    .project-frame:hover .view-details-btn {
      opacity: 1;
      pointer-events: auto;
    }
    
    .view-details-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: scale(1.05);
    }

    /* --- PROJECT DETAIL OVERLAY --- */
    .project-detail-overlay {
      position: fixed;
      inset: 0;
      z-index: 20000;
      background: #000000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .project-detail-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .project-detail-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 28px 40px;
      z-index: 20002;
      pointer-events: none;
    }

    .project-detail-back-btn {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 24px;
      border-radius: 40px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .project-detail-back-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: scale(1.03);
    }

    .project-detail-back-btn svg {
      width: 18px;
      height: 18px;
      fill: #ffffff;
    }

    .project-detail-title {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Anton', sans-serif;
      /* Stabilized font size for consistent look at 100% and 150% zoom */
      font-size: clamp(24px, 3.5vw, 46px); 
      line-height: 1; /* Locks text vertical boundaries to prevent invisible overlap */
      color: rgba(255, 255, 255, 0.88);
      letter-spacing: 6px;
      text-transform: uppercase;
      white-space: nowrap;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .project-detail-title.hidden {
      opacity: 0;
    }

    .project-detail-header-links {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .project-detail-header-link {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 10px;
      color: #ffffff;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .project-detail-header-link.github {
      border-radius: 50%;
    }

    .project-detail-header-link:hover {
      transform: scale(1.1);
      opacity: 0.85;
    }

    .project-detail-header-link svg {
      width: 28px;
      height: 28px;
      fill: #ffffff;
    }

    .project-detail-robot-bottom {
      position: fixed;
      right: 40px;
      bottom: 36px;
      z-index: 20002;

    /* --- CONTACT PAGE STYLES --- */

      border-radius: 12px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(255, 255, 255, 0.1);

      flex-direction: column;

    .contact-flip-front {
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    .contact-flip-front h2 {

      font-family: 'Inter', sans-serif;

      font-size: 14px;

    .shutter-loading-container {

      align-items: center;

      pointer-events: none;
      z-index: 16000;
    }
    .shutter-loading-container.active {
      opacity: 1;
    }
    .shutter-loading-text {

      color: #000;
      text-transform: uppercase;
      letter-spacing: 4px;

    .shutter-progress-fill {

      z-index: 0;

      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 199, 0, 0.4);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;

      opacity: 0;
      animation: bubble-pop-loop 7.5s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
      animation-delay: 0.4s; 
      transform-origin: bottom right;
      padding: 0 12px;

    .bot-bubble-dot1 {
      position: absolute;
      top: 12px;
      left: 125px;
      width: 14px;
      height: 14px;
      background: rgba(15, 15, 15, 0.85);
      border: 1px solid rgba(255, 199, 0, 0.4);
      border-radius: 50%;
      pointer-events: none;
      opacity: 0;
      animation: bubble-pop-loop 7.5s ease infinite;
      animation-delay: 0.2s;
    }
    .bot-bubble-dot2 {
      position: absolute;
      top: 28px;
      left: 115px;
      width: 8px;
      height: 8px;
      background: rgba(15, 15, 15, 0.85);
      border: 1px solid rgba(255, 199, 0, 0.4);
      border-radius: 50%;
      pointer-events: none;
      opacity: 0;
      animation: bubble-pop-loop 7.5s ease infinite;
      animation-delay: 0s;
    }

    @keyframes pulse-inner-loop {
      0% { transform: scale(1); }
      7.5% { transform: scale(1.5); }
      15% { transform: scale(1); }
      22.5% { transform: scale(1.5); }
      30% { transform: scale(1); }
      37.5% { transform: scale(1.5); }
      45% { top: 0; transform: scale(1); height: 17.5px; border-bottom-left-radius: 50%; border-bottom-right-radius: 50%; transform: rotate(-370deg); }
      50% { top: 22.5px; height: 10px; border-top-left-radius: 50%; border-top-right-radius: 50%; border-bottom-left-radius: 3rem; border-bottom-right-radius: 3rem; transform: rotate(10deg); }
      55% { transform: rotate(-10deg); }
      60% { transform: rotate(10deg); }
      65% { transform: rotate(-10deg); }
      70% { transform: rotate(0deg); }
      85% { top: 22.5px; height: 10px; border-top-left-radius: 50%; border-top-right-radius: 50%; border-bottom-left-radius: 3rem; border-bottom-right-radius: 3rem; transform: rotate(0deg); }
      92.5% { top: 22.5px; height: 10px; border-top-left-radius: 50%; border-top-right-radius: 50%; border-bottom-left-radius: 2.5rem; border-bottom-right-radius: 2.5rem; transform: rotate(0deg); }
      100% { top: 0; height: 17.5px; border-radius: 50%; transform: rotate(-360deg); }
    }
    @keyframes pulse-outer-loop {
      0% { transform: scale(1); }
      7.5% { transform: scale(1.5); }
      15% { transform: scale(1); }
      22.5% { transform: scale(1.5); }
      30% { transform: scale(1); }
      37.5% { transform: scale(1.5); }
      45% { transform: scale(1); height: 17.5px; }
      55% { transform: scale(1); height: 5px; }
      60% { height: 17.5px; }
      75% { height: 17.5px; }
      80% { transform: scale(1); height: 5px; }
      85% { height: 17.5px; }
      100% { height: 17.5px; }
    }
    @keyframes antenna-appear-loop {
      0%, 50% { visibility: hidden; top: -100px; height: 0; }
      55%, 95% { visibility: visible; top: -125px; height: 20px; }
      100% { top: -100px; height: 0; }
    }
    @keyframes beam-appear-loop {
      0%, 50% { visibility: hidden; top: -12.5px; height: 0; }
      55%, 100% { visibility: visible; top: -12.5px; height: 20px; width: 20px; }
    }
    @keyframes beam-pulsar-appear-loop {
      0%, 50% { visibility: hidden; top: -12.5px; height: 0; }
      55%, 75% { visibility: visible; top: -12.5px; left: -5px; height: 20px; width: 20px; opacity: 1; }
      65%, 85% { top: -25px; left: -15px; height: 40px; width: 40px; opacity: 0; visibility: visible; }
      74%, 94%, 100% { visibility: hidden; opacity: 0; }
    }
    @keyframes bot-up-down-loop {
      0%, 25%, 50%, 75%, 100% { transform: translate(0) scale(0.5); }
      12.5%, 37.5%, 62.5%, 87.5% { transform: translate(0, 2%) scale(0.5); }
    }
    @keyframes bubble-pop-loop {
      0%, 48% { opacity: 0; transform: scale(0.5) translateY(10px); }
      50% { opacity: 1; transform: scale(1.05) translateY(-2px); }
      52%, 83% { opacity: 1; transform: scale(1) translateY(0); }
      85%, 100% { opacity: 0; transform: scale(0.5) translateY(10px); }

    /* --- AI CHAT PANEL --- */
    .ai-chat-panel {
      position: fixed;
      top: 0;
      right: 0;
      height: 100vh;
      width: 420px;
      background: rgba(10, 10, 10, 0.75);
      backdrop-filter: blur(25px) saturate(180%);
      -webkit-backdrop-filter: blur(25px) saturate(180%);
      border-left: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: -10px 0 40px rgba(0, 0, 0, 0.8);
      z-index: 21000;
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      font-family: 'Inter', sans-serif;
      color: #ffffff;
    }
    
    .ai-chat-panel.active {
      transform: translateX(0);
    }

    .ai-chat-header {
      padding: 24px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
    }

    .ai-chat-title-wrap {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .ai-chat-title {
      font-family: 'Anton', sans-serif;
      font-size: 22px;
      letter-spacing: 1.5px;
      color: var(--brand-yellow);
      text-transform: uppercase;
      margin: 0;
    }

    .ai-chat-subtitle {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.5);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .ai-chat-close-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .ai-chat-close-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: scale(1.05);
    }
    .ai-chat-close-btn svg {
      width: 16px;
      height: 16px;
      fill: #ffffff;
    }

    .ai-chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    /* Message Styling */
    .ai-chat-msg {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 13.5px;
      line-height: 1.5;
      word-wrap: break-word;
      position: relative;
    }

    .ai-chat-msg.user {
      align-self: flex-end;
      background: rgba(255, 199, 0, 0.15);
      border: 1px solid rgba(255, 199, 0, 0.3);
      border-bottom-right-radius: 4px;
      color: #ffffff;
    }

    .ai-chat-msg.assistant {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-bottom-left-radius: 4px;
      color: rgba(255, 255, 255, 0.9);
    }

    .ai-chat-msg.system-alert {
      align-self: center;
      max-width: 95%;
      background: rgba(255, 85, 85, 0.1);
      border: 1px solid rgba(255, 85, 85, 0.3);
      border-radius: 8px;
      font-size: 12px;
      color: #ff8585;
      text-align: center;
    }

    .ai-chat-msg.system-info {

      max-width: 95%;

      border: 1px solid rgba(255, 199, 0, 0.2);
      border-radius: 8px;
      font-size: 12px;
      color: var(--brand-yellow);
      text-align: center;
    }

    .ai-chat-input-area {
      padding: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: rgba(5, 5, 5, 0.4);
    }

    .ai-chat-input-wrap {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .ai-chat-input {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 12px 20px;
      color: #ffffff;
      font-size: 13.5px;
      outline: none;
      transition: all 0.3s ease;
    }
    .ai-chat-input:focus {

      border-color: var(--brand-yellow);
    }

    .ai-chat-send-btn {
      background: var(--brand-yellow);
      border: none;
      width: 42px;
      height: 42px;
      border-radius: 50%;

      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .ai-chat-send-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 0 12px rgba(255, 199, 0, 0.5);
    }
    .ai-chat-send-btn:disabled {
      background: rgba(255, 255, 255, 0.15);
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    .ai-chat-send-btn svg {
      width: 18px;
      height: 18px;
      fill: #000000;
    }
    .ai-chat-send-btn:disabled svg {
      fill: rgba(255, 255, 255, 0.4);
    }

    .ai-chat-key-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.4);
      cursor: pointer;
      align-self: flex-start;
      transition: color 0.3s ease;
    }
    .ai-chat-key-toggle:hover {
      color: var(--brand-yellow);
    }
    .ai-chat-key-toggle svg {
      width: 12px;
      height: 12px;
      fill: currentColor;
    }

    .ai-chat-key-input-area {
      display: flex;
      gap: 8px;
      width: 100%;
      animation: slideDown 0.3s ease;
    }

    .ai-chat-key-input {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      padding: 6px 10px;
      color: #ffffff;
      font-size: 11px;
      outline: none;
    }
    .ai-chat-key-save-btn {
      background: var(--brand-yellow);

      padding: 6px 12px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;

    .ai-chat-key-save-btn:hover {

    .ai-chat-typing {
      display: flex;

      align-items: center;
      height: 12px;
      padding-top: 4px;
    }

      height: 6px;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 50%;

    .ai-chat-typing span:nth-child(1) { animation-delay: -0.32s; }
    .ai-chat-typing span:nth-child(2) { animation-delay: -0.16s; }

    const VideoGrid = ({ currentProject }) => {
      const [rows, setRows] = React.useState([]);
      const videoElementsRef = React.useRef({});

      React.useEffect(() => {
        let desktopCounter = 1;
        let mobileCounter = 1;

        const getD = () => {
          const c = desktopCounter;
          desktopCounter = desktopCounter >= 15 ? 1 : desktopCounter + 1;
          return c;
        };

        const getM = () => {
          const c = mobileCounter;
          mobileCounter = mobileCounter >= 5 ? 1 : mobileCounter + 1;
          return c;
        };

        const generatedRows = [];
        // Reduced from 7 rows to 5 rows to save memory
        for (let r = 0; r < 5; r++) { 
          const items = [];
          // Reduced from 14 items per row to 8 items to prevent lagging
          for (let i = 0; i < 8; i++) { 
            if ((i + 1) % 3 === 0) {
              items.push({ type: 'mobile', src: `m${getM()}.webm` });
            } else {
              items.push({ type: 'desktop', src: `${getD()}.webm` });
            }
          }
          generatedRows.push(items);
        }
        setRows(generatedRows);
      }, []);

      const uniqueVideos = React.useMemo(() => {
        const set = new Set();
        rows.forEach(row => row.forEach(item => set.add(item.src)));
        return Array.from(set);
      }, [rows]);

      return (
        <div className="video-grid-container">
          {currentProject === 0 && (
            <div style={{ position: 'absolute', width: '1px', height: '1px', opacity: 0, overflow: 'hidden', pointerEvents: 'none' }}>
              {uniqueVideos.map((src) => (
                <video
                  key={src}
                  src={encodeURI(`/visuals/vedios/${src}`)}
                  autoPlay
                  loop
                  muted
                  playsInline
                  preload="auto"
                  ref={(el) => {
                    if (el) videoElementsRef.current[src] = el;
                  }}
                />
              ))}
            </div>
          )}

          {rows.map((rowItems, rIdx) => (
            <div key={rIdx} className={`video-grid-row ${rIdx % 2 !== 0 ? 'offset' : ''}`}>
              {rowItems.map((item, iIdx) => (
                <div key={iIdx} className={`video-grid-item ${item.type}`}>
                  {currentProject === 0 ? (
                    <GridCanvas videoSrc={item.src} videoElementsRef={videoElementsRef} />
                  ) : null}
                </div>
              ))}
            </div>
          ))}
          <div className="video-grid-vignette"></div>
        </div>
      );
    };

    const VenomCursor = ({ isDark }) => {
      const canvasRef = useRef(null);
      const particles = useRef([]);
      const lastMouse = useRef({ x: window.innerWidth/2, y: window.innerHeight/2 });
      const mouse = useRef({ x: window.innerWidth/2, y: window.innerHeight/2 });
      const isDarkRef = useRef(isDark);

      useEffect(() => {
        isDarkRef.current = isDark;
      }, [isDark]);

      useEffect(() => {
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        
        const resize = () => {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        };
        resize();
        window.addEventListener('resize', resize);

        const handleMouseMove = (e) => {
          mouse.current = { x: e.clientX, y: e.clientY };
          
          const dx = mouse.current.x - lastMouse.current.x;
          const dy = mouse.current.y - lastMouse.current.y;
          const speed = Math.sqrt(dx*dx + dy*dy);
          
          if (speed > 1) {
            const numParticles = Math.min(Math.floor(speed / 4), 8) + 3; 
            
            for(let i = 0; i < numParticles; i++) {
              particles.current.push({
                x: mouse.current.x + (Math.random() - 0.5) * 15,
                y: mouse.current.y + (Math.random() - 0.5) * 15,
                vx: (-dx * 0.04) + (Math.random() - 0.5) * 1.5,
                vy: (-dy * 0.04) + (Math.random() - 0.5) * 1.5,
                size: Math.random() * 35 + 25, 
                life: 1,
                decay: Math.random() * 0.015 + 0.01 
              });
            }
          }
          lastMouse.current = { x: e.clientX, y: e.clientY };
        };
        window.addEventListener('mousemove', handleMouseMove);

        const animate = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          
          ctx.fillStyle = '#FFC700'; 
          
          for(let i = particles.current.length - 1; i >= 0; i--) {
            let p = particles.current[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life -= p.decay;
            p.size *= 0.94; 

            if(p.life <= 0 || p.size <= 0.5) {
              particles.current.splice(i, 1);
            } else {
              ctx.beginPath();

              onClick={handleNextProject}
              style={{ 
                opacity: currentProject === totalProjects - 1 ? 0 : 1, 
                pointerEvents: currentProject === totalProjects - 1 ? 'none' : 'auto' 
              }}
            >
              <svg viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
            </div>
            
            {/* The scaled down project cards preview */}
            <div 
              style={{
                position: 'absolute',
                top: '50%',
                left: '50%',
                transform: 'translate(-50%, -50%)',
                width: '600px', 
                height: '350px',
                zIndex: 14000,
                perspective: '1000px'
              }}
            ></div>
          </div>

          <div className={`work-page ${shutterPhase === 3 || shutterPhase === 4 ? 'active' : ''}`}>
            <header className="work-header">
                <a href="https://github.com/trendtrove2989-ai" target="_blank" rel="noopener noreferrer" className="site-logo" title="View GitHub Profile">
                  <GithubIcon />
                </a>
                <nav>
                  <a onClick={goToHome} style={{ cursor: 'pointer' }}>HOME</a>
                  <a onClick={goToWork} style={{ cursor: 'pointer' }}>WORK</a>
                  <a onClick={goToContact} style={{ cursor: 'pointer' }}>CONTACT</a>
                </nav>
                <div style={{ width: '50px' }}></div>
              </header>
            <div 
              className="carousel-track"
              style={{
                display: 'flex',
                width: `${totalProjects * 100}vw`,
                transform: `translateX(-${smoothProject * 100}vw)`,
                transition: 'none',
                height: '100vh',
                position: 'absolute',
                inset: 0
              }}
            >
              {Array.from({ length: totalProjects }).map((_, projectIdx) => (
                <div 
                  key={projectIdx}
                  className={`work-content-scaler ${isZoomedOut ? 'zoomed-out' : ''}`}
                  style={{ 
                    position: 'relative', 
                    width: '100vw', 
                    height: '100vh', 
                    flexShrink: 0 
                  }}
                >
                  {projectIdx === 0 ? (
                    <>
                      <VideoGrid currentProject={currentProject} />

                      <div className="work-center-content">
                        <button 
                          className="glass-magnify-btn" 
                          onClick={() => setIsZoomedOut(true)}
                          style={{ opacity: isZoomedOut ? 0 : 1, pointerEvents: isZoomedOut ? 'none' : 'auto', transition: 'opacity 0.3s ease' }}
                        >
                          VIEW PROJECTS
                        </button>
                      </div>
                    </>
                  ) : (
                    <div className="project-frame">
                      {Math.abs(currentProject - projectIdx) <= 1 ? (
                        <video 
                          src={`/visuals/vedios/${projectIdx}.webm`} 
                          className="project-img"
                          autoPlay 
                          loop 
                          muted 
                          playsInline
                        />
                      ) : null}
                      <button 
                        className="view-details-btn"
                        onClick={() => openProjectDetail(projectIdx)}
                      >
                        VIEW DETAILS
                      </button>
                    </div>
                  )}
                </div>
              ))}
            </div>
            </div>

          {/* --- INTEGRATED PREMIUM CORE VECTOR BOT CONTROL --- */}
          <div 
            className={`bot-interactive-wrap ${((shutterPhase === 3 && isZoomedOut) || isContactPage || detailOpen) && !chatOpen ? 'visible' : ''}`}
            onClick={() => {
              if (detailOpen && activeDetailProject !== null) {
                openAIChat(activeDetailProject + 1);
              } else if (shutterPhase === 3 && isZoomedOut && currentProject > 0) {
                openAIChat(currentProject);
              } else {
                openAIChat(null);
              }
            }}
          >
            <div className="bot-thought-bubble">
              {detailOpen ? "ask me any thing about this project" : "i am available 24/7"}
            </div>
            <div className="bot-bubble-dot1"></div>
            <div className="bot-bubble-dot2"></div>
            
            <div className="bot-container-asset">
              <div id="chatbot-premium">
                <div className="bot-premium-dot"></div>
                <div className="bot-premium-dot"></div>
                <div className="bot-premium-dot"></div>
              </div>
              <div id="chatbot-corner-premium"></div>
              <div id="antenna-premium">
                <div id="beam-premium"></div>
                <div id="beam-pulsar-premium"></div>
              </div>
            </div>
          </div>

          {/* --- CONTACT PAGE --- */}
          <div className={`contact-page ${contactShutterPhase === 3 || contactShutterPhase === 4 || isContactPage ? 'active' : ''}`}>
             <header className="work-header header-white">
                <div style={{ width: '50px' }}></div>
                <nav>
                  <a onClick={goToHome} style={{ cursor: 'pointer' }}>HOME</a>
                  <a onClick={goToWork} style={{ cursor: 'pointer' }}>WORK</a>
                  <a onClick={goToContact} style={{ cursor: 'pointer' }}>CONTACT</a>
                </nav>
                <div style={{ width: '50px' }}></div>
              </header>
             <div className="contact-flip-container">
               <div className="contact-flip-inner">
                 <div className="contact-flip-front">
                   <h2>Contact Us</h2>
                   <p>Move cursor here to talk</p>
                 </div>
                 <form className="contact-flip-back" onSubmit={handleSendEmail} style={{ width: '100%' }}>
                   <h2>Send Message</h2>
                   <div className="contact-form-group">
                     <label>Full Name</label>
                     <input 
                       type="text" 
                       value={contactName} 
                       onChange={(e) => setContactName(e.target.value)} 
                       required 
                     />
                   </div>
                   <div className="contact-form-group">
                     <label>Email</label>
                     <input 
                       type="email" 
                       value={contactEmail} 
                       onChange={(e) => setContactEmail(e.target.value)} 
                       required 
                     />
                   </div>
                   <div className="contact-form-group">
                     <label>Message</label>
                     <textarea 
                       value={contactMsg} 
                       onChange={(e) => setContactMsg(e.target.value)} 
                       required
                     ></textarea>
                   </div>
                   <button type="submit" className="glassy-submit-btn" disabled={contactButtonText === 'Sending...'}>
                     {contactButtonText}
                   </button>
                 </form>
               </div>
             </div>

             <div className="contact-glassy-socials">
               <a href="https://wa.me/923205270810" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp"><WhatsAppIcon /></a>
               <a href="https://www.linkedin.com/in/ahmad-farooq-211320349/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn"><LinkedInIcon /></a>
               <a href="https://github.com/trendtrove2989-ai" target="_blank" rel="noopener noreferrer" aria-label="GitHub"><GithubIcon /></a>
               <a href="mailto:ahmadfarooq.dev2989@gmail.com" aria-label="Email"><EmailIcon /></a>
             </div>
          </div>

          <div className={`contact-shutter-container phase-${contactShutterPhase}`}>
            <div className="shutter-panel">
              <div className="work-btn" onClick={openContactPage}>
                <EmailIcon /> CONTACT
              </div>
            </div>
          </div>

          {/* --- PROJECT DETAIL OVERLAY --- */}
          {detailOpen && activeDetailProject !== null && (() => {
            const detailData = PROJECT_DETAILS[activeDetailProject] || PROJECT_DETAILS[0];
            const projectNum = activeDetailProject + 1;
            const mediaSrc = encodeURI(`/visuals/images/project ${projectNum}/project ${projectNum} detail 1.png`);
            return (
              <div className={`project-detail-overlay active ${detailExpanded ? 'expanded' : ''}`}>
                <div className="project-detail-header">
                  <button className="project-detail-back-btn" onClick={closeProjectDetail}>
                    <BackArrowIcon /> BACK
                  </button>
                  <h2 className={`project-detail-title ${detailPage > 0 ? 'hidden' : ''}`}>{detailData.name}</h2>
                  <div className="project-detail-header-links">
                    <a className="project-detail-header-link" href={detailData.linkedin} target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
                      <LinkedInIcon />
                    </a>
                    <a className="project-detail-header-link github" href={detailData.github} target="_blank" rel="noopener noreferrer" aria-label="GitHub">
                      <GithubIcon />
                    </a>
                  </div>
                </div>

                

                <div className="project-detail-page-indicator">
                  {[0, 1, 2].map((i) => (
                    <div key={i} className={`project-detail-dot ${detailPage === i ? 'active' : ''}`} />
                  ))}
                </div>

                <div
                  className="project-detail-scroll"
                  ref={detailScrollRef}
                  onScroll={() => {
                    if (detailScrollRef.current) {
                      const page = Math.round(detailScrollRef.current.scrollTop / window.innerHeight);
                      setDetailPage(page);
                    }
                  }}
                >
                  <div className="project-detail-page">
                    <div className="project-detail-hero">
                      <div className="project-detail-media-wrap">
                        <video 
                          src={`/visuals/vedios/${projectNum}.webm`} 
                          autoPlay 
                          loop 
                          muted 
                          playsInline 
                        />
                      </div>
                      {detailData.showVisitSite !== false && (
                        <a
                          className="project-detail-visit-btn"
                          href={detailData.visitSiteUrl || '#'}
                          target="_blank"
                          rel="noopener noreferrer"
                        >
                          VISIT SITE
                        </a>
                      )}
                    </div>
                  </div>

                  <div className="project-detail-page">
                    <div className="project-detail-about-page">
                      <div className="project-detail-about-content">
                        <h2 className="project-detail-about-title">ABOUT PROJECT</h2>
                        <p className="project-detail-about-text">{detailData.info}</p>
                      </div>
                      <div className="project-detail-about-images">
                        <div className="about-img-card">
                          <img src={encodeURI(`/visuals/images/project ${projectNum}/project ${projectNum} detail 1.png`)} alt={`Project ${projectNum} Detail 1`} />
                        </div>
                        <div className="about-img-card">
                          <img src={encodeURI(`/visuals/images/project ${projectNum}/project ${projectNum} detail 2.png`)} alt={`Project ${projectNum} Detail 2`} />
                        </div>
                        <div className="about-img-card">
                          <img src={encodeURI(`/visuals/images/project ${projectNum}/project ${projectNum} detail 3.png`)} alt={`Project ${projectNum} Detail 3`} />
                        </div>
                      </div>
                    </div>
                  </div>

                  <div className="project-detail-page">
                    <div className="project-detail-text-page">
                      <h3 className="project-detail-section-label">Objective</h3>
                      <p className="project-detail-section-body">{detailData.objective}</p>
                    </div>
                  </div>
                </div>
              </div>
            );
          })()}

          <div className={`shutter-container phase-${shutterPhase}`}>
            <div className="shutter-panel">
              <div className="work-btn" onClick={openWorkPage}>
                <SearchIcon /> MY WORK
              </div>
            </div>
          </div>

          <div className={`shutter-loading-container ${isLoading ? 'active' : ''}`}>
            <div className="shutter-loading-text">
              {initialLoad ? "WELCOME" : "PROCESSING"}
            </div>
            <div className="shutter-progress-track">
              <div className="shutter-progress-fill" style={{ width: `${progressWidth}%` }}></div>
            </div>
          </div>

          {/* --- AI CHAT PANEL --- */}
          <div className={`ai-chat-panel ${chatOpen ? 'active' : ''}`}>
            <div className="ai-chat-header">
              <div className="ai-chat-title-wrap">
                <h2 className="ai-chat-title">
                  {chatProjectIdx !== null ? PROJECT_DETAILS[chatProjectIdx - 1]?.name : "AI Assistant"}
                </h2>
                <span className="ai-chat-subtitle">
                  {chatProjectIdx !== null ? "Project Helper" : "Ahmad's Portfolio Helper"}
                </span>
              </div>
              <button className="ai-chat-close-btn" onClick={() => setChatOpen(false)}>
                <svg viewBox="0 0 24 24" style={{ width: '16px', height: '16px', fill: '#fff' }}><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
              </button>
            </div>

            <div className="ai-chat-messages">
              {chatMessages.map((msg, idx) => (
                <div key={idx} className={`ai-chat-msg ${msg.role}`}>
                  {msg.content}
                </div>
              ))}
              {chatLoading && (
                <div className="ai-chat-msg assistant" style={{ display: 'flex', alignItems: 'center', minWidth: '60px' }}>
                  <div className="ai-chat-typing">
                    <span></span>
                    <span></span>
                    <span></span>
                  </div>
                </div>
              )}
              <div ref={chatEndRef} />
            </div>

            <div className="ai-chat-input-area">
              <div className="ai-chat-key-toggle" onClick={() => setShowKeyInput(!showKeyInput)}>
                <svg viewBox="0 0 24 24" style={{ marginRight: '6px' }}><path d="M12.65 10C11.83 7.67 9.61 6 7 6c-3.31 0-6 2.69-6 6s2.69 6 6 6c2.61 0 4.83-1.67 5.65-4H17v4h4v-4h2v-4H12.65zM7 14c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg>
                {apiKey ? "API Key Configured (Click to change)" : "Configure Groq API Key"}
              </div>

              {showKeyInput && (
                <div className="ai-chat-key-input-area">
                  <input 
                    type="password" 
                    placeholder="Enter Groq API Key"
                    defaultValue={apiKey}
                    className="ai-chat-key-input"
                    id="groq_key_input"
                    onKeyDown={(e) => {
                      if (e.key === 'Enter') {
                        handleSaveApiKey(e.target.value);
                      }
                    }}
                  />
                  <button 
                    className="ai-chat-key-save-btn"
                    onClick={() => {
                      const val = document.getElementById('groq_key_input')?.value;
                      handleSaveApiKey(val || '');
                    }}
                  >
                    SAVE
                  </button>
                </div>
              )}

              <form className="ai-chat-input-wrap" onSubmit={handleSendChatMessage}>
                <input 
                  type="text" 
                  placeholder="Ask a question..."
                  value={chatInput}
                  onChange={(e) => setChatInput(e.target.value)}
                  className="ai-chat-input"
                  disabled={chatLoading}
                />
                <button type="submit" className="ai-chat-send-btn" disabled={chatLoading || !chatInput.trim()}>
                  <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                </button>
              </form>
            </div>
          </div>

        </div>
      );
    };

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
