<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ahmad's Portfolio</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "three": "https://esm.sh/three@0.160.0",
        "@react-three/fiber": "https://esm.sh/@react-three/fiber@8.15.12?external=react,react-dom,three",
        "@studio-freight/lenis": "https://esm.sh/@studio-freight/lenis@1.0.39"
      }
    }
  </script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --brand-yellow: #FFC700;
      --bg-color: #000000;
      --text-main: var(--brand-yellow);
      --text-secondary: var(--brand-yellow);
      --nav-bg: rgba(255, 255, 255, 0.1);
      --nav-border: rgba(255, 255, 255, 0.2);
    }

    [data-theme="light"] {
      --bg-color: var(--brand-yellow);
      --text-main: #000000;
      --text-secondary: #000000;
      --nav-bg: rgba(0, 0, 0, 0.1);
      --nav-border: rgba(0, 0, 0, 0.3);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      margin: 0;
      padding: 0;
      background-color: #050505;
      color: white;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      cursor: default; 
      user-select: none;
    }

    .r3f-container {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
    }

    .layout-wrapper {
      position: relative; z-index: 10;
      width: 100vw; height: 100vh;
      background-color: var(--bg-color);
      transition: background-color 0.4s ease;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      overflow: hidden;
    }

    header {
      position: fixed; /* Changed from absolute to fixed */
      top: 30px; left: 0; width: 100%;
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 40px; z-index: 100;
    }

    .github-logo {
      width: 50px; height: 50px; border-radius: 50%;
      background: var(--text-secondary); color: var(--bg-color);
      display: flex; align-items: center; justify-content: center;
      transition: 0.4s;
    }
    .github-logo svg { width: 30px; height: 30px; fill: var(--bg-color); transition: 0.4s; }
    [data-theme="light"] .github-logo svg { fill: var(--brand-yellow); }

    nav {
      background: var(--nav-bg); border: 1px solid var(--nav-border);
      padding: 12px 35px; border-radius: 50px;
      backdrop-filter: blur(8px); display: flex; gap: 30px;
    }
    nav a {
      color: var(--text-secondary); text-decoration: none; font-size: 13px;
      letter-spacing: 1.5px; font-weight: 600; transition: color 0.4s; cursor: pointer;
    }

    .theme-switch {
      background: var(--nav-bg); border: 1px solid var(--nav-border);
      padding: 8px 12px; border-radius: 30px;
      display: flex; align-items: center; gap: 15px; cursor: pointer;
      backdrop-filter: blur(8px); transition: 0.4s;
    }
    .theme-switch svg { width: 18px; height: 18px; fill: var(--text-secondary); opacity: 0.5; transition: 0.3s; }
    .theme-switch .active svg { opacity: 1; fill: var(--brand-yellow); }
    [data-theme="light"] .theme-switch .active svg { fill: #000; }

    .hero-text {
      font-family: 'Anton', sans-serif;
      font-size: 13vw;
      color: var(--text-main);
      text-transform: uppercase;
      line-height: 0.8;
      text-align: center;
      position: absolute; top: 45%; left: 50%;
      transform: translate(-50%, -50%);
      white-space: nowrap;
      z-index: 15; 
      transition: color 0.4s ease;
    }

    .person-img {
      position: absolute; bottom: 0; left: 50%;
      transform: translateX(-50%);
      height: 75vh;
      object-fit: contain;
      z-index: 10000; 
      pointer-events: none;
    }

    .socials {
      position: absolute; left: 40px; bottom: 40px;
      display: flex; flex-direction: column; gap: 22px; z-index: 100;
    }
    .socials svg { width: 22px; height: 22px; fill: var(--text-secondary); transition: 0.4s; cursor: pointer;}

    .glitch-wrapper {
      position: absolute; right: 40px; bottom: 40px;
      font-family: 'Inter', sans-serif; font-weight: 600;
      font-size: 18px; letter-spacing: 2px;
      color: var(--text-secondary); z-index: 100;
      transition: color 0.4s; text-transform: uppercase;
    }
    .glitch { position: relative; display: inline-block; }
    .glitch::before, .glitch::after {
      content: attr(data-text); position: absolute; top: 0; left: 0;
      width: 100%; height: 100%; background: transparent; color: var(--text-secondary);
      opacity: 0;
    }
    .glitch.active::before {
      left: 3px; text-shadow: -2px 0 red; opacity: 1;
      animation: glitch-anim 0.2s infinite linear alternate-reverse;
    }
    .glitch.active::after {
      left: -3px; text-shadow: -2px 0 blue; opacity: 1;
      animation: glitch-anim-2 0.3s infinite linear alternate-reverse;
    }

    @keyframes glitch-anim {
      0% { clip-path: inset(20% 0 80% 0); }
      50% { clip-path: inset(60% 0 10% 0); }
      100% { clip-path: inset(40% 0 40% 0); }
    }
    @keyframes glitch-anim-2 {
      0% { clip-path: inset(10% 0 60% 0); }
      50% { clip-path: inset(80% 0 5% 0); }
      100% { clip-path: inset(30% 0 20% 0); }
    }

    .venom-wrapper {
      position: fixed; inset: 0; z-index: 9999; pointer-events: none;
      mix-blend-mode: difference; 
    }
    .venom-goo-container {
      width: 100%; height: 100%;
      filter: url('#venom-goo');
    }
    canvas { width: 100vw; height: 100vh; display: block; }

    .shutter-container {
      position: fixed;
      inset: 0;
      z-index: 15000;
      pointer-events: none;
      display: flex;
      align-items: flex-end;
    }

    .shutter-panel {
      width: 100vw;
      height: 100vh;
      background: rgba(255, 204, 0, 0.985); 
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      transform: translateY(100%);
      transition: transform 0.5s ease;
      position: relative;
      pointer-events: auto;
    }

    [data-theme="light"] .shutter-panel {
      background: rgba(0, 0, 0, 0.95);
    }

    .work-btn {
      position: absolute;
      top: -100px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(40px) saturate(200%);
      -webkit-backdrop-filter: blur(40px) saturate(200%);
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 0 20px rgba(255, 255, 255, 0.25);
      color: var(--text-secondary);
      padding: 12px 30px;
      border-radius: 40px; 
      font-weight: 600;
      letter-spacing: 2px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      opacity: 0;
      transition: all 0.3s ease;
      pointer-events: auto; 
    }

    .work-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateX(-50%) scale(1.05);
    }

    [data-theme="light"] .work-btn {
      background: rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(0, 0, 0, 0.3);
      color: #000;
    }

    .shutter-container.phase-1 .shutter-panel {
      transform: translateY(82%);
    }
    .shutter-container.phase-1 .work-btn { opacity: 1; }
    
    .shutter-container.phase-2 .shutter-panel,
    .shutter-container.phase-4 .shutter-panel {
      transform: translateY(0%);
      transition: transform 1.8s cubic-bezier(0.1, 0.95, 0.2, 1);
    }
    .shutter-container.phase-2 .work-btn,
    .shutter-container.phase-4 .work-btn { 
      opacity: 0; 
      pointer-events: none; 
    }
    
    .shutter-container.phase-3 .shutter-panel {
      transform: translateY(-100%);
      transition: transform 1.8s cubic-bezier(0.8, 0, 0.9, 0.1);
    }

    .work-page {
      position: absolute;
      inset: 0;
      z-index: 14000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg-color);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0s;
    }
    
    .work-page.active { opacity: 1; pointer-events: auto; }

    /* --- NEW WORK PAGE CENTER CONTENT --- */
    .work-center-content {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 15;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
      pointer-events: none; /* Allows hovering videos, but button re-enables it */
    }

    .welcome-text {
      font-family: 'Inter', sans-serif;
      font-weight: 800;
      font-size: 8vw;
      color: var(--brand-yellow);
      margin: 0;
      letter-spacing: 6px;
      line-height: 1;
      text-transform: uppercase;
      text-shadow: 0 10px 40px rgba(0,0,0,0.8);
    }

    .glass-magnify-btn {
      pointer-events: auto;
      width: 260px;
      height: 75px;
      border-radius: 40px; 
      background: rgba(255, 255, 255, 0.05);
      border: 1.5px solid rgba(255, 255, 255, 0.4);
      box-shadow: 
        0 8px 32px rgba(0, 0, 0, 0.5), 
        inset 0 0 20px rgba(255, 255, 255, 0.2);
      /* Backdrop filter sets the base for the glass look */
      backdrop-filter: blur(4px) brightness(1.2) contrast(1.1); 
      -webkit-backdrop-filter: blur(4px) brightness(1.2) contrast(1.1);
      color: #ffffff;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      letter-spacing: 3px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .glass-magnify-btn:hover {
      transform: scale(1.05);
      background: rgba(255, 255, 255, 0.15);
      box-shadow: 
        0 12px 40px rgba(0, 0, 0, 0.6), 
        inset 0 0 30px rgba(255, 255, 255, 0.4);
    }
    /* ----------------------------------- */

    .media-grid-wrapper {
      position: absolute;
      inset: -5%; 
      width: 110%;
      height: 110%;
      z-index: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050505; 
      overflow: hidden;
    }

    .media-grid-wrapper::after {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 5;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.98) 0%,
        rgba(0,0,0,0.7) 15%,
        rgba(0,0,0,0) 50%,
        rgba(0,0,0,0.7) 85%,
        rgba(0,0,0,0.98) 100%
      );
    }

    .media-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 12px; 
      width: 100vw;
      height: auto;
      padding: 0 2vw;
      align-content: center;
      justify-content: center;
      transform: scale(1.05);
    }

    .grid-item {
      height: 23vh; 
      border-radius: 12px;
      overflow: hidden;
      background: #1a1a1a;
      flex-grow: 1; 
      box-shadow: inset 0 0 10px rgba(0,0,0,0.8), 0 8px 15px rgba(0,0,0,0.9);
    }

    .grid-item:nth-child(7n + 1) { width: 22%; }
    .grid-item:nth-child(7n + 2) { width: 35%; }
    .grid-item:nth-child(7n + 3) { width: 12%; }
    .grid-item:nth-child(7n + 4) { width: 22%; }
    .grid-item:nth-child(7n + 5) { width: 35%; }
    .grid-item:nth-child(7n + 6) { width: 12%; }
    .grid-item:nth-child(7n + 7) { width: 28%; }

    .grid-item video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: blur(1.5px) brightness(0.65); 
      transform: scale(1.05); 
    }

    .work-header { 
      position: absolute; 
      top: 30px; 
      left: 0; 
      width: 100%; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      padding: 0 40px; 
      z-index: 15000; 
    }
    .work-header nav a { color: #fff !important; text-shadow: none !important; }
    .work-header .github-logo { background: rgba(255,255,255,0.1) !important; color: #fff !important; border: 1px solid rgba(255,255,255,0.2); box-shadow: none !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }
    .work-header .github-logo svg { fill: #fff !important; filter: none !important; }
    .work-header nav, .work-header .theme-switch { background: rgba(255,255,255,0.05) !important; border: 1px solid rgba(255,255,255,0.2) !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; box-shadow: none !important; }
    .work-header .theme-switch svg { fill: #fff !important; opacity: 0.6; filter: none !important; }
    .work-header .theme-switch .active svg { fill: #fff !important; opacity: 1; filter: none !important; }
    /* --- ZOOM OUT CAROUSEL STYLES --- */
    .work-zoom-ui {
      position: absolute;
      inset: 0;
      z-index: 16000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
      background: transparent;
      overflow: hidden;
    }
    
    .grid-welcome-content {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease, transform 0.6s ease;
      transform: translateY(20px);
    }

    .grid-welcome-content.active {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .welcome-grid-title {
      font-family: 'Anton', sans-serif;
      font-size: 8vw;
      color: var(--brand-yellow);
      letter-spacing: 2px;
      text-align: center;
      text-transform: uppercase;
      text-shadow: 2px 2px 0px #000, -2px -2px 0px #000, 4px 4px 15px rgba(0,0,0,0.8);
      margin: 0;
      line-height: 1.1;
    }
    
    .work-zoom-ui.active {
      opacity: 1;
      pointer-events: none; /* Allows clicks to pass through to the header */
    }

    .work-content-scaler {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      transform-origin: center;
      transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), border-radius 0.8s ease, box-shadow 0.8s ease;
      overflow: hidden;
      background: var(--bg-color);
    }

    /* --- ENHANCED GLASS PANE OVERLAY --- */
    .work-content-scaler::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.8s ease;
      z-index: 100;
      /* CHANGED TO BLACK: Inner rim and shadows are now dark to create depth */
      box-shadow: inset 0 0 0 2px rgba(0, 0, 0, 0.7), 
                  inset 0 0 50px rgba(0, 0, 0, 0.6),
                  inset 20px 20px 80px rgba(0, 0, 0, 0.4);
      /* Softened the diagonal light reflection so the black shadow stands out more */
      background: linear-gradient(
        135deg, 
        rgba(255, 255, 255, 0.1) 0%, 
        rgba(255, 255, 255, 0.02) 20%, 
        rgba(255, 255, 255, 0) 50%, 
        rgba(255, 255, 255, 0.01) 80%,
        rgba(255, 255, 255, 0.08) 100%
      );
    }
    
    .work-content-scaler.zoomed-out {
      transform: scale(0.55);
      border-radius: 30px; 
      
      /* SOFTER, LESS INTENSE WHITE SHADOW: Tighter blur and lower opacity */
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.05), 
                  0 15px 35px rgba(255, 255, 255, 0.08), 
                  0 0 0 1px rgba(255, 255, 255, 0.15);
      pointer-events: none; 
    }

    .work-content-scaler.zoomed-out::after {
      opacity: 1;
    }

    .carousel-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 50px;
      height: 50px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 13600;
      transition: 0.3s;
      pointer-events: auto; /* Re-enables clicks specifically for the arrows */
    }
    .carousel-arrow svg { fill: #fff; width: 24px; height: 24px; }
    .carousel-arrow:hover { background: rgba(255, 255, 255, 0.2); transform: translateY(-50%) scale(1.1); }
    .carousel-arrow.left { left: 4%; }
    .carousel-arrow.right { right: 4%; }

    .ticker-container {
      position: absolute;
      bottom: 8%;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      align-items: center;
      height: 40px;
      z-index: 13600;
    }
    .ticker-bar {
      width: 3px;
      background: rgba(255, 255, 255, 1);
      border-radius: 2px;
      transition: all 0.2s ease;
    }
    .ticker-bar.active { background: #fff; box-shadow: 0 0 10px rgba(255,255,255,0.8); }

    .project-frame {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #050505;
      overflow: hidden;
      pointer-events: auto;
    }
    
    .project-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: all 0.4s ease;
    }
    
    .project-frame:hover .project-img {
      filter: blur(8px) brightness(0.3);
      transform: scale(1.05);
    }
    
    .view-details-btn {
      position: absolute;
      opacity: 0;
      pointer-events: none;
      width: 220px;
      height: 60px;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.05);
      border: 1.5px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(8px) brightness(1.2);
      -webkit-backdrop-filter: blur(8px) brightness(1.2);
      color: #ffffff;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.4s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }
    
    .project-frame:hover .view-details-btn {
      opacity: 1;
      pointer-events: auto;
    }
    
    .view-details-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: scale(1.05);
    }

    /* --- PROJECT DETAIL OVERLAY --- */
    .project-detail-overlay {
      position: fixed;
      inset: 0;
      z-index: 20000;
      background: #000000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .project-detail-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .project-detail-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 28px 40px;
      z-index: 20002;
      pointer-events: none;
    }

    .project-detail-back-btn {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 24px;
      border-radius: 40px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .project-detail-back-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: scale(1.03);
    }

    .project-detail-back-btn svg {
      width: 18px;
      height: 18px;
      fill: #ffffff;
    }

    .project-detail-title {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Anton', sans-serif;
      font-size: clamp(2.2rem, 5.5vw, 4.5rem);
      color: rgba(255, 255, 255, 0.88);
      letter-spacing: 6px;
      text-transform: uppercase;
      white-space: nowrap;
      pointer-events: none;
    }

    .project-detail-header-links {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .project-detail-header-link {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 10px;
      color: #ffffff;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .project-detail-header-link.github {
      border-radius: 50%;
    }

    .project-detail-header-link:hover {
      transform: scale(1.1);
      opacity: 0.85;
    }

    .project-detail-header-link svg {
      width: 28px;
      height: 28px;
      fill: #ffffff;
    }

    .project-detail-robot-bottom {
      position: fixed;
      right: 40px;
      bottom: 36px;
      z-index: 20002;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.5s ease 0.5s;
    }

    .project-detail-overlay.expanded .project-detail-robot-bottom {
      opacity: 1;
    }

    .project-detail-robot-bottom svg {
      width: 40px;
      height: 40px;
      stroke: #ffffff;
      fill: none;
    }

    .project-detail-hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      width: 100%;
    }

    .project-detail-visit-btn {
      pointer-events: auto;
      padding: 14px 32px;
      border-radius: 40px;
      background: rgba(255, 255, 255, 0.05);
      border: 1.5px solid rgba(255, 255, 255, 0.35);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px) brightness(1.2);
      -webkit-backdrop-filter: blur(8px) brightness(1.2);
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 2.5px;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.4s ease;
      opacity: 0;
      transform: translateY(16px);
    }

    .project-detail-overlay.expanded .project-detail-visit-btn {
      opacity: 1;
      transform: translateY(0);
      transition-delay: 0.35s;
    }

    .project-detail-visit-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: scale(1.05);
    }

    .project-detail-scroll {
      height: 100vh;
      overflow-y: auto;
      overflow-x: hidden;
      scroll-snap-type: y mandatory;
      scroll-behavior: smooth;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .project-detail-scroll::-webkit-scrollbar {
      display: none;
    }

    .project-detail-page {
      height: 100vh;
      scroll-snap-align: start;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 110px 50px 50px;
      box-sizing: border-box;
    }

    .project-detail-media-wrap {
      width: 78%;
      max-width: 1300px;
      aspect-ratio: 16 / 9;
      border-radius: 50px;
      overflow: hidden;
      background: #0a0a0a;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8);
      transform: scale(0.52);
      opacity: 0;
      transition: transform 1s cubic-bezier(0.16, 1, 0.3, 1),
                  opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1),
                  border-radius 1s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .project-detail-overlay.expanded .project-detail-media-wrap {
      transform: scale(1);
      opacity: 1;
    }

    .project-detail-media-wrap img,
    .project-detail-media-wrap video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .project-detail-text-page {
      max-width: 800px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 28px;
      opacity: 0;
      transform: translateY(40px);
      transition: opacity 0.7s ease 0.15s, transform 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.15s;
    }

    .project-detail-overlay.expanded .project-detail-text-page {
      opacity: 1;
      transform: translateY(0);
    }

    /* --- NEW ABOUT PROJECT PAGE --- */
    .project-detail-about-page {
      width: 100%;
      max-width: 1400px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      opacity: 0;
      transform: translateY(40px);
      transition: opacity 0.7s ease 0.15s, transform 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.15s;
      padding: 0 40px;
    }
    .project-detail-overlay.expanded .project-detail-about-page {
      opacity: 1;
      transform: translateY(0);
    }
    .project-detail-about-content {
      flex: 1;
      text-align: left;
      padding-right: 60px;
    }
    .project-detail-about-title {
      font-family: 'Anton', sans-serif;
      font-size: clamp(3.5rem, 6vw, 5.5rem);
      color: rgba(255, 255, 255, 0.88);
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 30px;
      line-height: 1;
    }
    .project-detail-about-text {
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      font-size: clamp(1rem, 1.4vw, 1.2rem);
      color: rgba(255, 255, 255, 0.65);
      line-height: 1.8;
      max-width: 600px;
    }
    .project-detail-about-images {
      flex: 1;
      position: relative;
      height: 550px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .about-img-card {
      position: absolute;
      width: 320px;
      height: 480px;
      border-radius: 30px;
      background: #1a1a1a;
      box-shadow: -20px 20px 40px rgba(0,0,0,0.8), inset 0 0 0 1px rgba(255,255,255,0.15);
      overflow: hidden;
      transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
    }
    .about-img-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .about-img-card:nth-child(1) {
      transform: rotate(-35deg) translate(-140px, 40px);
      z-index: 1;
      filter: brightness(0.6);
    }
    .about-img-card:nth-child(2) {
      transform: rotate(-20deg) translate(-70px, 20px);
      z-index: 2;
      filter: brightness(0.85);
    }
    .about-img-card:nth-child(3) {
      transform: rotate(-5deg) translate(0, 0);
      z-index: 3;
      filter: brightness(1);
    }
    .project-detail-about-images:hover .about-img-card:nth-child(1) {
      transform: rotate(-42deg) translate(-180px, 50px);
    }
    .project-detail-about-images:hover .about-img-card:nth-child(2) {
      transform: rotate(-25deg) translate(-90px, 25px);
    }
    .project-detail-about-images:hover .about-img-card:nth-child(3) {
      transform: rotate(-5deg) translate(15px, -10px);
    }

    .project-detail-section-label {
      font-family: 'Inter', sans-serif;
      font-weight: 800;
      font-size: clamp(2rem, 4vw, 3.2rem);
      color: #ffffff;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    .project-detail-section-body {
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      font-size: clamp(1rem, 1.6vw, 1.2rem);
      color: rgba(255, 255, 255, 0.65);
      line-height: 1.8;
      letter-spacing: 0.5px;
    }

    .project-detail-page-indicator {
      position: fixed;
      right: 30px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 20002;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.5s ease 0.5s;
    }

    .project-detail-overlay.expanded .project-detail-page-indicator {
      opacity: 1;
    }

    .project-detail-dot {
      width: 3px;
      height: 24px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.25);
      transition: all 0.3s ease;
    }

    .project-detail-dot.active {
      height: 36px;
      background: #ffffff;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.6);
    }
    /* --- CONTACT PAGE STYLES --- */
    .contact-page {
      position: absolute;
      inset: 0;
      z-index: 14000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg-color);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0s;
    }
    .contact-page.active { opacity: 1; pointer-events: auto; }

    .contact-shutter-container {
      position: fixed;
      inset: 0;
      z-index: 15000;
      pointer-events: none;
      display: flex;
      align-items: flex-end;
    }
    
    .contact-shutter-container.phase-1 .shutter-panel { transform: translateY(82%); }
    .contact-shutter-container.phase-1 .work-btn { opacity: 1; }
    
    .contact-shutter-container.phase-2 .shutter-panel,
    .contact-shutter-container.phase-4 .shutter-panel {
      transform: translateY(0%);
      transition: transform 1.8s cubic-bezier(0.1, 0.95, 0.2, 1);
    }
    .contact-shutter-container.phase-2 .work-btn,
    .contact-shutter-container.phase-4 .work-btn { opacity: 0; pointer-events: none; }
    
    .contact-shutter-container.phase-3 .shutter-panel {
      transform: translateY(-100%);
      transition: transform 1.8s cubic-bezier(0.8, 0, 0.9, 0.1);
    }

    .contact-flip-container {
      perspective: 1000px;
      width: 400px;
      height: 540px;
      z-index: 10;
    }
    .contact-flip-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      transform-style: preserve-3d;
    }
    .contact-flip-container:hover .contact-flip-inner {
      transform: rotateY(180deg);
    }
    .contact-flip-front, .contact-flip-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(15px) brightness(1.2);
      -webkit-backdrop-filter: blur(15px) brightness(1.2);
      display: flex;
      flex-direction: column;
    }
    
    .contact-flip-front {
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    .contact-flip-front h2 {
      font-family: 'Inter', sans-serif;
      font-weight: 800;
      font-size: 32px;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin: 0;
    }
    .contact-flip-front p {
      position: absolute;
      bottom: 30px;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 10px;
      letter-spacing: 2px;
      opacity: 0.8;
      text-transform: uppercase;
    }

    .contact-flip-back {
      transform: rotateY(180deg);
      padding: 40px;
      align-items: flex-start;
      color: #fff;
    }
    .contact-flip-back h2 {
      font-family: 'Inter', sans-serif;
      font-weight: 800;
      font-size: 20px;
      letter-spacing: 2px;
      margin-bottom: 30px;
      text-transform: uppercase;
      align-self: center;
    }
    .contact-form-group {
      width: 100%;
      margin-bottom: 20px;
      text-align: left;
    }
    .contact-form-group label {
      display: block;
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 1px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    .contact-form-group input, .contact-form-group textarea {
      width: 100%;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 8px;
      padding: 12px;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      outline: none;
      transition: all 0.3s ease;
    }
    .contact-form-group input:focus, .contact-form-group textarea:focus {
      background: rgba(255, 255, 255, 0.3);
      border-color: rgba(255, 255, 255, 0.5);
    }
    .contact-form-group textarea {
      height: 100px;
      resize: none;
    }

    .glassy-submit-btn {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 8px;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }
    .glassy-submit-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
    }

    .shutter-loading-container {
      position: fixed;
      top: 50vh;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
      z-index: 16000;
    }
    .shutter-loading-container.active {
      opacity: 1;
    }
    .shutter-loading-text {
      font-family: 'Anton', sans-serif;
      font-size: 6vw;
      font-weight: 900;
      color: #000;
      text-transform: uppercase;
      letter-spacing: 4px;
      margin-bottom: 10px;
    }
    .shutter-progress-track {
      width: 250px;
      height: 2px;
      background-color: rgba(0, 0, 0, 0.2);
      overflow: hidden;
    }
    .shutter-progress-fill {
      height: 100%;
      background-color: #000;
      width: 0%;
      transition: width 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    [data-theme="light"] .shutter-loading-text {
      color: #fff;
    }
    [data-theme="light"] .shutter-progress-track {
      background-color: rgba(255, 255, 255, 0.2);
    }
    [data-theme="light"] .shutter-progress-fill {
      background-color: #fff;
    }

    .contact-glassy-socials {
      display: flex;
      gap: 25px;
      margin-top: 40px;
      z-index: 10;
    }
    .contact-glassy-socials a {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 55px;
      height: 55px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px) brightness(1.2);
      -webkit-backdrop-filter: blur(10px) brightness(1.2);
      transition: all 0.4s ease;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), inset 0 0 15px rgba(255, 255, 255, 0.05);
    }
    .contact-glassy-socials a svg {
      width: 26px;
      height: 26px;
      fill: #fff;
      transition: all 0.4s ease;
    }
    .contact-glassy-socials a:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateY(-6px) scale(1.05);
      border-color: rgba(255, 255, 255, 0.4);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4), inset 0 0 20px rgba(255, 255, 255, 0.1);
    }

    /* White header override for Contact page */
    .header-white .github-logo { background: rgba(255,255,255,0.1) !important; color: #fff !important; border: 1px solid rgba(255,255,255,0.2); }
    .header-white .github-logo svg { fill: #fff !important; }
    .header-white nav, .header-white .theme-switch { background: rgba(255,255,255,0.05) !important; border: 1px solid rgba(255,255,255,0.2) !important; }
    .header-white nav a { color: #fff !important; text-shadow: none !important; }
    .header-white .theme-switch svg { fill: #fff !important; opacity: 0.6; }
    .header-white .theme-switch .active svg { fill: #fff !important; opacity: 1; }

    /* Video Grid Layout */
    .video-grid-container {
      position: absolute;
      top: -10vh; left: -10vw; 
      width: 120vw; 
      height: 120vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 1.5vw;
      overflow: hidden;
      z-index: 0;
      background: #050505;
      pointer-events: none;
    }

    .video-grid-row {
      display: flex;
      gap: 1.5vw;
      width: max-content;
      transform: translateX(0);
    }

    .video-grid-row.offset {
      transform: translateX(-15vw);
    }

    .video-grid-item {
      height: 22vh;
      border-radius: 12px;
      overflow: hidden;
      background: #111;
      box-shadow: 0 8px 24px rgba(0,0,0,0.8);
    }

    .video-grid-item.desktop {
      width: calc(22vh * 1.77);
    }

    .video-grid-item.mobile {
      width: calc(22vh * 0.56);
    }

    .video-grid-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.85;
      transition: opacity 0.5s ease;
    }

    .video-grid-item img:hover {
      opacity: 1;
    }

    .video-grid-vignette {
      position: absolute;
      top: 10vh; left: 10vw; 
      width: 100vw; height: 100vh;
      background: linear-gradient(to bottom, 
        rgba(0,0,0,0.98) 0%, 
        rgba(0,0,0,0.6) 15%, 
        rgba(0,0,0,0.1) 30%, 
        rgba(0,0,0,0) 50%, 
        rgba(0,0,0,0.1) 70%, 
        rgba(0,0,0,0.6) 85%, 
        rgba(0,0,0,0.98) 100%);
      z-index: 0;
      pointer-events: none;
    }
  </style>

</head>

        let desktopCounter = 1;
        let mobileCounter = 1;

        const getD = () => {
          const c = desktopCounter;
          desktopCounter = desktopCounter >= 15 ? 1 : desktopCounter + 1;
          return c;
        };

        const getM = () => {
          const c = mobileCounter;
          mobileCounter = mobileCounter >= 5 ? 1 : mobileCounter + 1;
          return c;
        };

        const generatedRows = [];
        for (let r = 0; r < 7; r++) { 
          const items = [];
          for (let i = 0; i < 14; i++) { 
            if ((i + 1) % 3 === 0) {
              items.push({ type: 'mobile', src: `m${getM()}.mp4` });
            } else {
              items.push({ type: 'desktop', src: `${getD()}.mp4` });

          }
          generatedRows.push(items);
        }
        setRows(generatedRows);
      }, []);

        <div className="video-grid-container">

            <div key={rIdx} className={`video-grid-row ${rIdx % 2 !== 0 ? 'offset' : ''}`}>

    const VenomCursor = ({ isDark }) => {
      const canvasRef = useRef(null);
      const particles = useRef([]);
      const lastMouse = useRef({ x: window.innerWidth/2, y: window.innerHeight/2 });
      const mouse = useRef({ x: window.innerWidth/2, y: window.innerHeight/2 });
      const isDarkRef = useRef(isDark);

      useEffect(() => {
        isDarkRef.current = isDark;
      }, [isDark]);

      useEffect(() => {
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        
        const resize = () => {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        };
        resize();
        window.addEventListener('resize', resize);

        const handleMouseMove = (e) => {
          mouse.current = { x: e.clientX, y: e.clientY };
          
          const dx = mouse.current.x - lastMouse.current.x;
          const dy = mouse.current.y - lastMouse.current.y;
          const speed = Math.sqrt(dx*dx + dy*dy);
          
          if (speed > 1) {
            const numParticles = Math.min(Math.floor(speed / 4), 8) + 3; 
            
            for(let i = 0; i < numParticles; i++) {
              particles.current.push({
                x: mouse.current.x + (Math.random() - 0.5) * 15,
                y: mouse.current.y + (Math.random() - 0.5) * 15,
                vx: (-dx * 0.04) + (Math.random() - 0.5) * 1.5,
                vy: (-dy * 0.04) + (Math.random() - 0.5) * 1.5,
                size: Math.random() * 35 + 25, 
                life: 1,
                decay: Math.random() * 0.015 + 0.01 
              });
            }
          }
          lastMouse.current = { x: e.clientX, y: e.clientY };
        };
        window.addEventListener('mousemove', handleMouseMove);

        const animate = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          
          ctx.fillStyle = '#FFC700'; 
          
          for(let i = particles.current.length - 1; i >= 0; i--) {
            let p = particles.current[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life -= p.decay;
            p.size *= 0.94; 

            if(p.life <= 0 || p.size <= 0.5) {
              particles.current.splice(i, 1);
            } else {
              ctx.beginPath();
              ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
              ctx.fill();
            }
          }

          requestAnimationFrame(animate);
        };
        animate();

        return () => {
          window.removeEventListener('resize', resize);
          window.removeEventListener('mousemove', handleMouseMove);
        };
      }, []);

      return (
        <div className="venom-wrapper">
          <div className="venom-goo-container">
            <canvas ref={canvasRef} />
          </div>
        </div>
      );
    };

    const App = () => {
      const [isDark, setIsDark] = useState(true);
      const [roleText, setRoleText] = useState("GLITCH TEXT");
      const [glitchActive, setGlitchActive] = useState(false);
      const [shutterPhase, setShutterPhase] = useState(2); // Starts fully covered for initial load
      const [initialLoad, setInitialLoad] = useState(true);
      const [isLoading, setIsLoading] = useState(true);
      const [progressWidth, setProgressWidth] = useState(0);
      const [isZoomedOut, setIsZoomedOut] = useState(false);
      const [isGridWelcome, setIsGridWelcome] = useState(false);
      const [currentProject, setCurrentProject] = useState(0);
      const [smoothProject, setSmoothProject] = useState(0);
      const targetProgress = useRef(0);
      const currentProgress = useRef(0);
      const scrollSnapTimeout = useRef(null);
      const scrollAccumulator = useRef(0);
      const totalProjects = 10;
      const scrollLock = useRef(false);
      const [detailOpen, setDetailOpen] = useState(false);
      const [detailExpanded, setDetailExpanded] = useState(false);
      const [activeDetailProject, setActiveDetailProject] = useState(null);
      const [detailPage, setDetailPage] = useState(0);
      const [contactShutterPhase, setContactShutterPhase] = useState(0);
      const [isContactPage, setIsContactPage] = useState(false);
      const detailScrollRef = useRef(null);

      const playTickSound = () => {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        
        oscillator.type = 'triangle';
        oscillator.frequency.setValueAtTime(600, audioCtx.currentTime); // Pitch
        
        gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime); // Volume
        gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05); // Short tick decay
        
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 0.05);
      };

      const playThreeTicks = () => {
        playTickSound();
        setTimeout(playTickSound, 150);
        setTimeout(playTickSound, 300);
      };

      const runProgress = () => {
        setProgressWidth(0);
        setTimeout(() => {
          setProgressWidth(70);
        }, 50);
        setTimeout(() => {
          setProgressWidth(100);
        }, 1200);
      };

      useEffect(() => {
        setTimeout(() => {
          runProgress();
        }, 400); 
        
        setTimeout(() => {
          setShutterPhase(0);
          setIsLoading(false);
        }, 3400); 
        
        setTimeout(() => {
          setInitialLoad(false);
          setProgressWidth(0);
        }, 4200); 
      }, []);

      const handleNextProject = () => {
        playThreeTicks();
        setCurrentProject((prev) => Math.min(prev + 1, totalProjects - 1));
      };

      const handlePrevProject = () => {
        playThreeTicks();
        setCurrentProject((prev) => Math.max(prev - 1, 0));
      };

      const openProjectDetail = (projectIdx) => {
        setActiveDetailProject(projectIdx - 1);
        setDetailPage(0);
        setDetailOpen(true);
        setDetailExpanded(false);
        if (detailScrollRef.current) detailScrollRef.current.scrollTop = 0;
        requestAnimationFrame(() => {
          requestAnimationFrame(() => setDetailExpanded(true));
        });
      };

      const closeProjectDetail = () => {
        setDetailExpanded(false);
        setTimeout(() => {
          setDetailOpen(false);
          setActiveDetailProject(null);
          setDetailPage(0);
        }, 900);
      };

      const openContactPage = () => {
        setContactShutterPhase(2); 
        setTimeout(() => {
          setIsLoading(true);
          runProgress();
        }, 800);
        setTimeout(() => {
          setContactShutterPhase(3); 
          setIsContactPage(true);
          setIsLoading(false);
          setTimeout(() => setProgressWidth(0), 400);
        }, 3800); 
      };

      useEffect(() => {
        targetProgress.current = currentProject;
      }, [currentProject]);

      useEffect(() => {
        let animationFrameId;
        const renderLoop = () => {
          if (Math.abs(targetProgress.current - currentProgress.current) > 0.001) {
            currentProgress.current += (targetProgress.current - currentProgress.current) * 0.1;
            setSmoothProject(currentProgress.current);
          }
          animationFrameId = requestAnimationFrame(renderLoop);
        };
        renderLoop();
        return () => cancelAnimationFrame(animationFrameId);
      }, []);

      const closeContactPage = () => {
        setContactShutterPhase(4); 
        setIsContactPage(false);
        setTimeout(() => {
          setIsLoading(true);
          runProgress();
        }, 800);
        setTimeout(() => {
          setContactShutterPhase(0); 
          setIsLoading(false);
          setTimeout(() => setProgressWidth(0), 400);
        }, 3800); 
      };

      const goToHome = () => {
        if (contactShutterPhase > 0 && contactShutterPhase !== 4) closeContactPage();
        if (shutterPhase > 0 && shutterPhase !== 4) closeWorkPage();
        setTimeout(() => {
          setIsZoomedOut(false);
          setIsGridWelcome(false);
          targetProgress.current = 0;
          currentProgress.current = 0;
          setSmoothProject(0);
        }, 1000);
      };

      const goToWork = () => {
        if (contactShutterPhase > 0 && contactShutterPhase !== 4) closeContactPage();
        if (shutterPhase === 0) openWorkPage();
        setTimeout(() => {
          setIsGridWelcome(true);
          setIsZoomedOut(false);
          targetProgress.current = 0;
          currentProgress.current = 0;
          setSmoothProject(0);
        }, 1000);
      };

      const goToContact = () => {
        if (shutterPhase > 0 && shutterPhase !== 4) closeWorkPage();
        if (contactShutterPhase === 0) openContactPage();
      };

      useEffect(() => {
        const handleWheel = (e) => {
          if (scrollLock.current) return;
          if (Math.abs(e.deltaY) < 20) return;

          const isScrollingDown = e.deltaY > 0;
          const isScrollingUp = e.deltaY < 0;

          const lockScroll = (duration) => {
            scrollLock.current = true;
            setTimeout(() => { scrollLock.current = false; }, duration);
          };

          if (detailOpen) {
            e.preventDefault();
            const container = detailScrollRef.current;
            if (!container) return;
            const totalDetailPages = 3;
            if (isScrollingDown && detailPage < totalDetailPages - 1) {
              const nextPage = detailPage + 1;
              container.scrollTo({ top: nextPage * window.innerHeight, behavior: 'smooth' });
              setDetailPage(nextPage);
              lockScroll(800);
            } else if (isScrollingUp && detailPage > 0) {
              const prevPage = detailPage - 1;
              container.scrollTo({ top: prevPage * window.innerHeight, behavior: 'smooth' });
              setDetailPage(prevPage);
              lockScroll(800);
            }
            return;
          }

          if (isZoomedOut && shutterPhase === 3 && detailPage === 0 && contactShutterPhase === 0) {
            scrollAccumulator.current += e.deltaY;
            const threshold = 350; 

            if (Math.abs(scrollAccumulator.current) >= threshold) {
               const steps = Math.trunc(scrollAccumulator.current / threshold);
               scrollAccumulator.current -= steps * threshold; 
               
               let newProject = currentProject + steps;
               
               if (newProject > totalProjects - 1) {
                  if (currentProject === totalProjects - 1) {
                     setContactShutterPhase(1);
                     scrollAccumulator.current = 0;
                     lockScroll(800);
                     return;
                  }
                  newProject = totalProjects - 1;
               } else if (newProject < 0) {
                  if (currentProject === 0) {
                     setIsZoomedOut(false);
                     scrollAccumulator.current = 0;
                     lockScroll(1500);
                     return;
                  }
                  newProject = 0;
               }
               
               if (newProject !== currentProject) {
                 setCurrentProject(newProject);
                 
                 if (newProject === 0) {
                    lockScroll(1500); 
                    scrollAccumulator.current = 0;
                 } else if (newProject === totalProjects - 1) {
                    lockScroll(800);
                    scrollAccumulator.current = 0;
                 }
               }
            }
            
            clearTimeout(scrollSnapTimeout.current);
            scrollSnapTimeout.current = setTimeout(() => {
               scrollAccumulator.current = 0;
            }, 100);
            return;
          }
          
          if (contactShutterPhase === 1) {
            if (isScrollingDown) {
              openContactPage();
              lockScroll(1800);
            } else if (isScrollingUp) {
              setContactShutterPhase(0);
              lockScroll(800);
            }
            return;
          }

          if (isContactPage) {
            if (isScrollingUp && contactShutterPhase === 3) {
               closeContactPage();
               lockScroll(2000);
            }
            return;
          }

          if (contactShutterPhase === 1) {
            if (isScrollingDown) {
              openContactPage();
              lockScroll(2000);
            } else if (isScrollingUp) {
              setContactShutterPhase(0);
              lockScroll(800);
            }
            return;
          }

          if (shutterPhase === 0) {
            if (isScrollingDown) {
              setShutterPhase(1);
              lockScroll(800);
            }
          } 
          else if (shutterPhase === 1) {
            if (isScrollingDown) {
              openWorkPage();
              lockScroll(2000);
            } else if (isScrollingUp) {
              setShutterPhase(0);
              lockScroll(800);
            }
          } 
          else if (shutterPhase === 3) {
            if (!isZoomedOut) {
              if (isScrollingDown) {
                setIsZoomedOut(true);
                lockScroll(1200); 
              } else if (isScrollingUp) {
                closeWorkPage();
                lockScroll(2000); 
              }
            }
          }
        };
        
        window.addEventListener('wheel', handleWheel, { passive: false });
        return () => window.removeEventListener('wheel', handleWheel);
      }, [shutterPhase, isZoomedOut, currentProject, detailOpen, detailPage, contactShutterPhase, isContactPage]);

      const openWorkPage = () => {
        setShutterPhase(2); 
        setTimeout(() => {
          setIsLoading(true);
          runProgress();
        }, 800);
        setTimeout(() => {
          setShutterPhase(3); 
          setIsLoading(false);
          setTimeout(() => setProgressWidth(0), 400);
        }, 3800); 
      };

      const closeWorkPage = () => {
        setShutterPhase(4); 
        setTimeout(() => {
          setIsLoading(true);
          runProgress();
        }, 800);
        setTimeout(() => {
          setShutterPhase(0); 
          setIsGridWelcome(false);
          setIsZoomedOut(false);
          setIsLoading(false);
          setTimeout(() => setProgressWidth(0), 400);
        }, 3800); 
      };

      const roles = ["GLITCH TEXT", "AI SCIENTIST", "WEB DEV", "DESIGNER", "3D ANIMATOR"];

      useEffect(() => {
        const lenis = new Lenis();
        function raf(time) { lenis.raf(time); requestAnimationFrame(raf); }
        requestAnimationFrame(raf);
      }, []);

      useEffect(() => {
        let index = 0;
        const interval = setInterval(() => {
          setGlitchActive(true);
          setTimeout(() => {
            index = (index + 1) % roles.length;
            setRoleText(roles[index]);
          }, 150);
          setTimeout(() => setGlitchActive(false), 300);
        }, 2500);
        return () => clearInterval(interval);
      }, []);

      useEffect(() => {
        document.body.setAttribute('data-theme', isDark ? 'dark' : 'light');
      }, [isDark]);

      return (
        <div className="layout-wrapper">
          <div className="r3f-container">
            <Canvas><ambientLight intensity={0.5} /></Canvas>
          </div>

          <VenomCursor />

          <header className={isContactPage ? "header-white" : ""}>
            <div className="github-logo"><GithubIcon /></div>
            <nav>
              <a onClick={goToHome} style={{ cursor: 'pointer' }}>HOME</a>
              <a onClick={goToWork} style={{ cursor: 'pointer' }}>WORK</a>
              <a onClick={goToContact} style={{ cursor: 'pointer' }}>CONTACT</a>
            </nav>
            <div className="theme-switch" onClick={() => setIsDark(!isDark)}>
              <div className={isDark ? 'active' : ''}><MoonIcon /></div>
              <div className={!isDark ? 'active' : ''}><SunIcon /></div>
            </div>
          </header>

          <h1 className="hero-text">AHMAD'S PORTFOLIO</h1>

          <img 
            src="my.png" 
            alt="Ahmad Profile" 
            className="person-img"
          />

          <div className="clouds"></div>

          <div className="socials">
            <InstaIcon />
            <LinkedInIcon />
            <EmailIcon />
            <WhatsAppIcon />
          </div>

          <div className="glitch-wrapper">
            <span className={`glitch ${glitchActive ? 'active' : ''}`} data-text={roleText}>
              {roleText}
            </span>
          </div>

          <div className={`work-zoom-ui ${isZoomedOut && contactShutterPhase === 0 && !isContactPage ? 'active' : ''}`} style={{ zIndex: 16000 }}>
            <div className="carousel-arrow left" onClick={handlePrevProject}>
              <svg viewBox="0 0 24 24"><path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6 1.41-1.41z"/></svg>
            </div>
            
            <div className="ticker-container" style={{ pointerEvents: 'none', width: '200px', perspective: '600px', justifyContent: 'center' }}>
              <div 
                style={{
                  position: 'relative',
                  width: '100%',
                  height: '40px',
                  transformStyle: 'preserve-3d',
                  transform: `translateZ(-180px) rotateY(${smoothProject * -(360 / totalProjects)}deg)`,
                  transition: 'none',
                  pointerEvents: 'auto'
                }}
              >
                {Array.from({ length: 40 }).map((_, idx) => {
                  const targetAngle = smoothProject * (360 / totalProjects);
                  const tickAngle = idx * (360 / 40);
                  let diff = Math.abs(targetAngle - tickAngle);
                  if (diff > 180) diff = 360 - diff;
                  
                  const continuousSteps = diff / 9;
                  let h = 6;
                  let opacity = 0.15;
                  let isCenter = false;
                  
                  if (continuousSteps < 7) {
                    const heights = [40, 32, 24, 18, 14, 10, 8, 6];
                    const opacities = [1, 0.85, 0.70, 0.55, 0.40, 0.25, 0.15, 0.15];
                    const idx1 = Math.floor(continuousSteps);
                    const idx2 = Math.min(7, idx1 + 1);
                    const fraction = continuousSteps - idx1;
                    
                    h = heights[idx1] * (1 - fraction) + heights[idx2] * fraction;
                    opacity = opacities[idx1] * (1 - fraction) + opacities[idx2] * fraction;
                    isCenter = continuousSteps < 0.5;
                  }
                  
                  return (
                    <div 
                      key={idx} 
                      onClick={() => targetProgress.current = Math.round(idx / 4) % totalProjects}
                      style={{ 
                        position: 'absolute',
                        top: 0,
                        left: '50%',
                        width: '20px', 
                        height: '40px', 
                        marginLeft: '-10px',
                        display: 'flex',
                        alignItems: 'center',
                        justifyContent: 'center',
                        cursor: 'pointer',
                        transform: `rotateY(${tickAngle}deg) translateZ(180px)`,
                        backfaceVisibility: 'hidden' 
                      }}
                    >
                      <div 
                        className={`ticker-bar ${isCenter ? 'active' : ''}`}
                        style={{ 
                          height: `${h}px`, 
                          width: isCenter ? '4px' : '3px',
                          opacity: opacity,
                          transition: 'none'
                        }} 
                      />
                    </div>
                  );
                })}
              </div>
            </div>

            <div className="carousel-arrow right" onClick={handleNextProject}>
              <svg viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
            </div>
            
            {/* The scaled down project cards preview */}
            <div 
              style={{
                position: 'absolute',
                top: '50%',
                left: '50%',
                transform: 'translate(-50%, -50%)',
                width: '600px', 
                height: '350px',
                zIndex: 14000,
                perspective: '1000px'
              }}
            ></div>
          </div>

          <div className={`work-page ${shutterPhase === 3 || shutterPhase === 4 ? 'active' : ''}`}>
            <header className="work-header">
                <div className="github-logo"><GithubIcon /></div>
                <nav>
                  <a onClick={goToHome} style={{ cursor: 'pointer' }}>HOME</a>
                  <a onClick={goToWork} style={{ cursor: 'pointer' }}>WORK</a>
                  <a onClick={goToContact} style={{ cursor: 'pointer' }}>CONTACT</a>
                </nav>
                <div style={{ width: '50px' }}></div>
              </header>
            <div 
              className="carousel-track"
              style={{
                display: 'flex',
                width: `${totalProjects * 100}vw`,
                transform: `translateX(-${smoothProject * 100}vw)`,
                transition: 'none',
                height: '100vh',
                position: 'absolute',
                inset: 0
              }}
            >
              {Array.from({ length: totalProjects }).map((_, projectIdx) => (
                <div 
                  key={projectIdx}
                  className={`work-content-scaler ${isZoomedOut ? 'zoomed-out' : ''}`}
                  style={{ 
                    position: 'relative', 
                    width: '100vw', 
                    height: '100vh', 
                    flexShrink: 0 
                  }}
                >
                  {projectIdx === 0 ? (
                    <>
                      <VideoGrid />

                      <div className="work-center-content">
                        <h1 className="welcome-text">WELCOME</h1>
                        <button 
                          className="glass-magnify-btn" 
                          onClick={() => setIsZoomedOut(true)}
                          style={{ opacity: isZoomedOut ? 0 : 1, pointerEvents: isZoomedOut ? 'none' : 'auto', transition: 'opacity 0.3s ease' }}
                        >
                          VIEW PROJECTS
                        </button>
                      </div>
                    </>
                  ) : (
                    <div className="project-frame">
                      <video 
                        src={`/visuals/vedios/${projectIdx}.mp4`} 
                        className="project-img"
                        autoPlay 
                        loop 
                        muted 
                        playsInline
                      />
                      <button 
                        className="view-details-btn"
                        onClick={() => openProjectDetail(projectIdx)}
                      >
                        VIEW DETAILS
                      </button>
                    </div>
                  )}
                </div>
              ))}
            </div>
          </div>

          {/* --- CONTACT PAGE --- */}
          <div className={`contact-page ${contactShutterPhase === 3 || contactShutterPhase === 4 || isContactPage ? 'active' : ''}`}>
             <header className="work-header header-white">
                <div style={{ width: '50px' }}></div>
                <nav>
                  <a onClick={goToHome} style={{ cursor: 'pointer' }}>HOME</a>
                  <a onClick={goToWork} style={{ cursor: 'pointer' }}>WORK</a>
                  <a onClick={goToContact} style={{ cursor: 'pointer' }}>CONTACT</a>
                </nav>
                <div style={{ width: '50px' }}></div>
              </header>
             <div className="contact-flip-container">
               <div className="contact-flip-inner">
                 <div className="contact-flip-front">
                   <h2>Contact Us</h2>
                   <p>Move cursor here to talk</p>
                 </div>
                 <div className="contact-flip-back">
                   <h2>Send Message</h2>
                   <div className="contact-form-group">
                     <label>Full Name</label>
                     <input type="text" />
                   </div>
                   <div className="contact-form-group">
                     <label>Email</label>
                     <input type="email" />
                   </div>
                   <div className="contact-form-group">
                     <label>Message</label>
                     <textarea></textarea>
                   </div>
                   <button className="glassy-submit-btn">Send Message</button>
                 </div>
               </div>
             </div>

             <div className="contact-glassy-socials">
               <a href="#" aria-label="WhatsApp"><WhatsAppIcon /></a>
               <a href="#" aria-label="LinkedIn"><LinkedInIcon /></a>
               <a href="#" aria-label="GitHub"><GithubIcon /></a>
               <a href="#" aria-label="Email"><EmailIcon /></a>
             </div>
          </div>

          <div className={`contact-shutter-container phase-${contactShutterPhase}`}>
            <div className="shutter-panel">
              <div className="work-btn" onClick={openContactPage}>
                <EmailIcon /> CONTACT
              </div>
            </div>
          </div>

          {/* --- PROJECT DETAIL OVERLAY --- */}
          {detailOpen && activeDetailProject !== null && (() => {
            const detailData = PROJECT_DETAILS[activeDetailProject] || PROJECT_DETAILS[0];
            const projectNum = activeDetailProject + 1;
            const mediaSrc = encodeURI(`/visuals/images/project ${projectNum}/project ${projectNum} detail 1.png`);
            return (
              <div className={`project-detail-overlay active ${detailExpanded ? 'expanded' : ''}`}>
                <div className="project-detail-header">
                  <button className="project-detail-back-btn" onClick={closeProjectDetail}>
                    <BackArrowIcon /> BACK
                  </button>
                  <h2 className="project-detail-title">{detailData.name}</h2>
                  <div className="project-detail-header-links">
                    <a className="project-detail-header-link" href={detailData.linkedin} target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
                      <LinkedInIcon />
                    </a>
                    <a className="project-detail-header-link github" href={detailData.github} target="_blank" rel="noopener noreferrer" aria-label="GitHub">
                      <GithubIcon />
                    </a>
                  </div>
                </div>

                <div className="project-detail-robot-bottom">
                  <RobotIcon />
                </div>

                <div className="project-detail-page-indicator">
                  {[0, 1, 2].map((i) => (
                    <div key={i} className={`project-detail-dot ${detailPage === i ? 'active' : ''}`} />
                  ))}
                </div>

                <div
                  className="project-detail-scroll"
                  ref={detailScrollRef}
                  onScroll={() => {
                    if (detailScrollRef.current) {
                      const page = Math.round(detailScrollRef.current.scrollTop / window.innerHeight);
                      setDetailPage(page);
                    }
                  }}
                >
                  <div className="project-detail-page">
                    <div className="project-detail-hero">
                      <div className="project-detail-media-wrap">
                        <video 
                          src={`/visuals/vedios/${activeDetailProject}.mp4`} 
                          autoPlay 
                          loop 
                          muted 
                          playsInline 
                        />
                      </div>
                      {detailData.showVisitSite !== false && (
                        <a
                          className="project-detail-visit-btn"
                          href={detailData.visitSiteUrl || '#'}
                          target="_blank"
                          rel="noopener noreferrer"
                        >
                          VISIT SITE
                        </a>
                      )}
                    </div>
                  </div>

                  <div className="project-detail-page">
                    <div className="project-detail-about-page">
                      <div className="project-detail-about-content">
                        <h2 className="project-detail-about-title">ABOUT PROJECT</h2>
                        <p className="project-detail-about-text">{detailData.info}</p>
                      </div>
                      <div className="project-detail-about-images">
                        <div className="about-img-card">
                          <img src={encodeURI(`/visuals/images/project ${projectNum}/project ${projectNum} detail 1.png`)} alt={`Project ${projectNum} Detail 1`} />
                        </div>
                        <div className="about-img-card">
                          <img src={encodeURI(`/visuals/images/project ${projectNum}/project ${projectNum} detail 2.png`)} alt={`Project ${projectNum} Detail 2`} />
                        </div>
                        <div className="about-img-card">
                          <img src={encodeURI(`/visuals/images/project ${projectNum}/project ${projectNum} detail 3.png`)} alt={`Project ${projectNum} Detail 3`} />
                        </div>
                      </div>
                    </div>
                  </div>

                  <div className="project-detail-page">
                    <div className="project-detail-text-page">
                      <h3 className="project-detail-section-label">Objective</h3>
                      <p className="project-detail-section-body">{detailData.objective}</p>
                    </div>
                  </div>
                </div>
              </div>
            );
          })()}

          <div className={`shutter-container phase-${shutterPhase}`}>
            <div className="shutter-panel">
              <div className="work-btn" onClick={openWorkPage}>
                <SearchIcon /> MY WORK
              </div>
            </div>
          </div>

          <div className={`shutter-loading-container ${isLoading ? 'active' : ''}`}>
            <div className="shutter-loading-text">
              {initialLoad ? "WELCOME" : "PROCESSING"}
            </div>
            <div className="shutter-progress-track">
              <div className="shutter-progress-fill" style={{ width: `${progressWidth}%` }}></div>
            </div>
          </div>

        </div>
      );
    };

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
